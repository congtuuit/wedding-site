<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C1425" />
      <stop offset="50%" stop-color="#600D1A" />
      <stop offset="100%" stop-color="#38060E" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Inner Shadow / Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Circle with Border -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,2" opacity="0.65" />

  <!-- Monogram T & H -->
  <!-- Letter T -->
  <text x="32" y="78" font-family="'Plus Jakarta Sans', 'Cinzel', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">T</text>

  <!-- Letter H -->
  <text x="96" y="78" font-family="'Plus Jakarta Sans', 'Cinzel', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">H</text>

  <!-- Central Heart Symbol -->
  <path d="M64 48 C60 40, 48 40, 48 53 C48 64, 64 76, 64 76 C64 76, 80 64, 80 53 C80 40, 68 40, 64 48 Z" fill="url(#heartGrad)" />
  
  <!-- Small Sparkle Top -->
  <path d="M64 22 L66 28 L72 30 L66 32 L64 38 L62 32 L56 30 L62 28 Z" fill="url(#goldGrad)" />
</svg>
